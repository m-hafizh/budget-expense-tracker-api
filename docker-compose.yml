name: budget-expense-tracker-api

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    env_file:
      - .env.docker
    environment:
      DB_PROVIDER: mongodb
      MONGODB_URI: mongodb://mongo:27017
      PORT: 3000
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3001:3000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 20s

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand({ ping: 1 }).ok"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app-sqlite:
    profiles: ["sqlite"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    env_file:
      - .env.docker
    environment:
      DB_PROVIDER: sqlite
      PORT: 3000
    ports:
      - "3002:3000"
    volumes:
      - sqlite_data:/home/node/.local/share/budget-expense-tracker
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 8
      start_period: 20s

volumes:
  mongo_data:
  sqlite_data:
